<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | AuraCheck</title>
    <link rel="icon" href="media/Logo.png">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-fondo">
    <main class="login-caja">
        <div class="marca">
            <img src="media/Logo.png" alt="Logo AuraCheck">AuraCheck
        </div>
        <h1>Recuperar contraseña</h1>
        <p>Ingresá tu correo y te enviaremos un enlace de recuperación.</p>
        <div class="mensaje" data-mensaje hidden></div>
        <form id="form-recuperar">
            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="nombre@correo.com" required autocomplete="email">
            </div>
            <div class="acciones">
                <button class="btn" type="submit">Enviar enlace</button>
            </div>
        </form>
        <p class="login-enlace"><a href="index.html">← Volver al inicio de sesión</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../api/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
