<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | AuraCheck</title>
    <link rel="icon" href="media/Logo.png">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="barra">
        <a class="marca" href="principal.html">
            <img src="media/Logo.png" alt="">AuraCheck
        </a>
        <nav class="nav">
            <a href="principal.html">Inicio</a>
            <a class="activo" href="agregar.html">Productos</a>
            <a href="inventario.html">Inventario</a>
            <a href="registrar.html">Registrar venta</a>
            <a href="historial-ventas.html">Ventas</a>
            <a href="reportar.html">Reportar</a>
        </nav>
    </header>
    <main class="contenedor">
        <header class="encabezado">
            <h1>Agregar productos</h1>
            <p>Cargá los artículos de tu negocio para mantener el inventario actualizado.</p>
        </header>
        <section class="tarjeta">
            <div class="mensaje" data-mensaje hidden></div>
            <form id="form-producto" class="form-grid">
                <div class="campo">
                    <label for="nombre">Nombre del producto</label>
                    <input id="nombre" name="nombre" placeholder="Ej. Remera básica" required maxlength="80">
                </div>
                <div class="campo">
                    <label for="cantidad">Cantidad inicial</label>
                    <input id="cantidad" name="cantidad" type="number" min="0" step="1" placeholder="0" required>
                </div>
                <div class="campo">
                    <label for="precio">Precio unitario ($)</label>
                    <input id="precio" name="precio" type="number" min="0" step="0.01" placeholder="0,00" required>
                </div>
                <div class="campo acciones">
                    <button class="btn" type="submit">+ Agregar producto</button>
                </div>
            </form>
        </section>
        <section class="tarjeta">
            <h2>Productos cargados <span class="estadistica" style="display:inline-block;padding:5px 12px;font-size:1rem" id="cantidad-productos">0</span></h2>
            <div class="tabla-wrap">
                <table id="tabla-productos">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Stock</th>
                            <th>Precio unitario</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
        <a href="principal.html">← Volver al inicio</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../api/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
