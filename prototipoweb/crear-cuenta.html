<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Crear cuenta | AuraCheck</title><link rel="icon" href="media/Logo.png"><link rel="stylesheet" href="css/estilos.css"><link rel="stylesheet" href="css/responsive.css"></head><body class="login-fondo"><main class="login-caja"><div class="marca"><img src="media/Logo.png" alt="Logo AuraCheck">AuraCheck</div><h1>Crear una cuenta</h1><p>Completá tus datos para comenzar.</p><div class="mensaje" data-mensaje hidden></div><form id="form-registro"><div class="campo"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required maxlength="50" autocomplete="given-name"></div><div class="campo"><label for="apellido">Apellido</label><input id="apellido" name="apellido" required maxlength="50" autocomplete="family-name"></div><div class="campo"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" required autocomplete="email"></div><div class="campo"><label for="password">Contraseña</label><input type="password" id="password" name="password" minlength="6" required autocomplete="new-password"></div><div class="campo"><label for="confirmar">Confirmar contraseña</label><input type="password" id="confirmar" name="confirmar" minlength="6" required autocomplete="new-password"></div><div class="acciones"><button class="btn" type="submit">Crear cuenta</button></div></form><p class="login-enlace">¿Ya tenés una cuenta? <a href="index.html">Iniciar sesión</a></p></main><script src="app.js"></script></body></html>
